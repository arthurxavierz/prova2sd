<!DOCTYPE html>

<html>
	<head>
		<title>Academia</title>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
		<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
		<script src="JS/Script_AlunosMatriculas.js"></script>
		<script>
			function montarMenu(){
				$("#div_Menu").load("Nav_Bar.html")
			}
		</script>
	</head>
	<body>
		<div id="div_Menu"></div>
		<script>montarMenu()</script>

		<div class="container-fluid mt-3">
			<h2>Alunos e suas Matrículas</h2>
			<div class="row mt-2">
				<div class="col-sm-3">
					<button id="btnListar" type="submit" class="btn btn-primary" onclick="consultar()">Listar</button>
				</div>
			</div>
			<div class="row mt-2">
				<div class="col-sm-8">
					<table class="table table-bordered" id="tabItens">
						<thead>
							<tr><th>ALUNO</th><th>CPF</th><th>PLANO</th><th>VALOR</th><th>INÍCIO</th><th>VENCIMENTO</th><th>STATUS</th></tr>
						</thead>
						<tbody>
							<tr>
								<td colspan="7" align="center">Clique em Listar para mostrar os dados...</td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
		</div>
	</body>
</html>
