<!DOCTYPE html>

<html>
	<head>
		<title>Academia</title>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
		<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
		<script src="JS/Script_Matriculas.js"></script>
		<script>
			function montarMenu(){
				$("#div_Menu").load("Nav_Bar.html")
			}
		</script>
	</head>
	<body>
		<div id="div_Menu"></div>
		<script>montarMenu()</script>

		<div class="container-fluid mt-3">
			<h2>Cadastro de Matrículas</h2>
			<div class="row" id="campoId">
				<div class="col-sm-3">
					<label for="selAluno" class="form-label">Selecione o aluno:</label>
					<select class="form-select" id="selAluno" name="selAluno">
					</select>
				</div>
				<div class="col-sm-3">
					<label for="txtPlano">Plano:</label>
					<input type="text" class="form-control" id="txtPlano" placeholder="Mensal, Trimestral..." name="txtPlano">
				</div>
			</div>
			<div class="row">
				<div class="col-sm-3">
					<label for="txtValor">Valor:</label>
					<input type="text" class="form-control" id="txtValor" placeholder="Valor do plano" name="txtValor">
				</div>
				<div class="col-sm-3">
					<label for="selStatus" class="form-label">Status:</label>
					<select class="form-select" id="selStatus" name="selStatus">
						<option value="ATIVA">ATIVA</option>
						<option value="TRANCADA">TRANCADA</option>
						<option value="CANCELADA">CANCELADA</option>
					</select>
				</div>
			</div>
			<div class="row">
				<div class="col-sm-3">
					<label for="txtDataInicio">Data de início:</label>
					<input type="date" class="form-control" id="txtDataInicio" name="txtDataInicio">
				</div>
				<div class="col-sm-3">
					<label for="txtDataVencimento">Data de vencimento:</label>
					<input type="date" class="form-control" id="txtDataVencimento" name="txtDataVencimento">
				</div>
			</div>

			<script type="text/javascript">preencherCombo();</script>

			<div class="row mt-2">
				<div class="col-sm-3">
					<button id="btnSalvar" type="submit" class="btn btn-primary" onclick="salvar()">Salvar</button>
					<button id="btnListar" type="submit" class="btn btn-primary" onclick="consultar()">Listar</button>
					<button id="btnNovo" type="submit" class="btn btn-primary" onclick="novo()" disabled>Novo</button>
				</div>
			</div>
			<div class="row">
				<div class="col-sm-8">
					<table class="table table-striped" id="tabItens">
						<thead>
							<tr><th>ALUNO</th><th>PLANO</th><th>VALOR</th><th>INÍCIO</th><th>VENCIMENTO</th><th>STATUS</th><th>EDIÇÃO</th><th>EXCLUSÃO</th></tr>
						</thead>
						<tbody>
							<tr>
								<td colspan="8" align="center">Clique em Listar para mostrar os dados...</td>
							</tr>
						</tbody>
					</table>
					<ul class="pagination">
						<li class="page-item"><button id="btnAnterior" type="button" class="btn btn-primary" disabled>&lsaquo; Anterior</button>&nbsp;</li>
						<li id="numeracao" class="page-item"></li>
						<li class="page-item">&nbsp;<button id="btnProximo" type="button" class="btn btn-primary" disabled>Próximo &rsaquo;</button></li>
					</ul>
				</div>
			</div>
		</div>
	</body>
</html>
